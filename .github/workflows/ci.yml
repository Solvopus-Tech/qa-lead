name: AgentHaven E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Xvfb for headless browser testing
        run: sudo apt-get install -y xvfb

      - name: Start Vite dev server
        run: |
          pnpm run dev &
          sleep 30  # Reduced sleep since health check now handles readiness

      - name: Run Playwright tests
        run: pnpm run test:e2e
        env:
          PWTEST_PARALLEL: "true"

      - name: Stop dev server
        run: pnpm run dev:stop

      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: projects/test-project/coverage/coverage-final.json

      - name: Save test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: projects/test-project/artifacts/**/*