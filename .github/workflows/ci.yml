name: AgentHaven E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/test-project

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: projects/test-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start API dev server
        run: |
          npm run dev-server &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/contacts >/dev/null && exit 0
            sleep 1
          done
          echo "dev server did not become ready on :3000"
          exit 1

      - name: Run test suite (vitest unit + API)
        run: npx vitest --run --coverage

      - name: Stop dev server
        if: always()
        run: pkill -f "json-server" || true

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: projects/test-project/coverage

      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            projects/test-project/artifacts/**/*
            projects/test-project/test-results/**/*
